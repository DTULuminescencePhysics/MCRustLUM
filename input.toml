# Edit this file to configure a simulation. Any omitted value uses the default
# from the corresponding structure in io/src/inputs.rs.

[shared_settings]
experiment_list = ["experiment_paper","experiment_1","experiment_2","experiment_3","experiment_4"]
time_temperature = "paper"
cube = "paper"
transitions = "delocalised"

[experiment_1]
filling = "fill_1"
band = "band_1"
trap_types = ["trap_1"]
total_traps = 200

[experiment_2]
filling = "fill_2"
band = "band_1"
trap_types = ["trap_2"]
total_traps = 200

[experiment_3]
filling = "fill_3"
band = "band_1"
trap_types = ["trap_3"]
total_traps = 200

[experiment_4]
filling = "fill_4"
band = "band_1"
trap_types = ["trap_4"]
total_traps = 200

[experiment_5]
filling = "fill_1"
band = "band_1"
trap_types = ["trap_1","trap_2"]
total_traps = 200

[experiment_paper]
filling = "paper"
band = "band_1"
trap_types = ["paper"]
total_traps = 500


####################################################################################################################################
####                                                        Cube                                                                 ###
####################################################################################################################################

[cubes.cube_1]
unit_cell_height =  {value = 0.1, unit = "nano metre"}
unit_cell_width =  {value = 0.1, unit = "nano metre"}
unit_cell_length =  {value = 0.1, unit = "nano metre"}
cube_height =  {value = 7.5, unit = "nano metre"}
cube_width =  {value = 7.5, unit = "nano metre"}
cube_length =  {value = 7.5, unit = "nano metre"}
hole_count = 5
bandtail_count = 0
periodic = true

[cubes.paper]
unit_cell_height =  {value = 0.1, unit = "nano metre"}
unit_cell_width =  {value = 0.1, unit = "nano metre"}
unit_cell_length =  {value = 0.1, unit = "nano metre"}
cube_height =  {value = 1, unit = "nano metre"}
cube_width =  {value = 1, unit = "nano metre"}
cube_length =  {value = 1, unit = "nano metre"}
hole_count = 1
bandtail_count = 0
periodic = true


####################################################################################################################################
####                                                      Time Temperature                                                       ###
####################################################################################################################################

[time_temperature.i]
times =        {value = [  0.5, 0.0], unit = "ma"}
temperatures = {value = [25.0, 25.0], unit = "celsius"}

[time_temperature.ii]
times =        {value = [ 0.5, 0.11,  0.1,  0.0], unit = "ma"}
temperatures = {value = [85.0, 85.0, 25.0, 25.0], unit = "celsius"}
[time_temperature.iii]
times =        {value = [  0.5, 0.18 ,  0.0], unit = "ma"}
temperatures = {value = [100.0, 100.0, 25.0], unit = "celsius"}
[time_temperature.iv]
times =        {value = [  0.5,  0.21, 0.19,  0.1, 0.09,  0.0], unit = "ma"}
temperatures = {value = [25.0, 25.0], unit = "celsius"}
[time_temperature.v]
times =        {value = [130.0, 130.0, 80.0, 80.0, 25.0, 25.0], unit = "ma"}
temperatures = {value = [25.0, 25.0], unit = "celsius"}
[time_temperature.vi]
times =        {value = [  0.5,   0.3,  0.29,   0.2, 0.19,  0.1, 0.09, 0.02,  0.0], unit = "ma"}
temperatures = {value = [140.0, 140.0, 100.0, 100.0, 80.0, 80.0, 45.0, 45.0, 25.0], unit = "celsius"}

[time_temperature.paper]
times =        {value = [  0.0, 160.0], unit = "second"}
temperatures = {value = [0.0, 800.0], unit = "celsius"}

